# Onion-Location — the value for snippets/onionLocation.conf, which explains
# the header. Here rather than there because `map` is http context.
#
# Two steps. First, which onion name mirrors the clearnet Host being served;
# names with no onion counterpart (staging, fortunes, mta-sts, openpgpkey, the
# wildcard) map to "" and get no header. Tor ignores everything left of the
# 56-character address, so the subdomain is carried by the Host header alone.
map $host $onion_host {
    default                            "";
    dreamstation.systems               dreamdzmalrqmkkptrzdvafx3lbinn3j5gvshqrnjtb72begyoqhwuqd.onion;
    www.dreamstation.systems           dreamdzmalrqmkkptrzdvafx3lbinn3j5gvshqrnjtb72begyoqhwuqd.onion;
    grandexchange.dreamstation.systems grandexchange.dreamdzmalrqmkkptrzdvafx3lbinn3j5gvshqrnjtb72begyoqhwuqd.onion;
}

# Second, only over HTTPS: Tor Browser ignores the header on plain HTTP (anyone
# on the path could have injected it), so sending it on :80 is wasted bytes.
# $https is "on" or "". This gate is also what makes the snippet safe to
# include from theme.conf, which is shared with the :80 and onion vhosts —
# there the value is "" and nginx omits a header whose value is empty.
map "$https:$onion_host" $onion_location {
    default           "";
    "~^on:(?<oh>.+)$" http://$oh$request_uri;
}
