# Brotli response compression, alongside the gzip nginx.conf already turns on.
#
# REQUIRES the libnginx-mod-http-brotli-filter package.
# Without it `brotli` is an unknown directive, nginx -t fails, and the promote
# rolls this file back. Its load_module line lives in
# /etc/nginx/modules-enabled/, which Debian's package owns, not this repo.
#
# WHY IT LIVES IN conf.d: http context, so it covers every vhost from one
# place. A server block can still override it (grandexchange sets its own
# gzip_types; it inherits everything below).
#
# HOW CLIENTS GET WHICH: the brotli filter runs before gzip. A client that
# sends `Accept-Encoding: br` gets brotli, and gzip then sees the body already
# encoded and leaves it alone. Clients without br fall through to gzip.
#
# WHY gzip_vary IS HERE: the brotli module has no Vary switch of its own; it
# reuses gzip_vary. Without it a shared cache could hand a br body to a
# client that never asked for one. nginx.conf leaves gzip_vary commented out,
# so setting it here does not collide.
#
# NEVER add `brotli_static on` (from the -static package) for /personal/: the
# same reason nginx.txt gives for gzip_static. The SSI filter cannot parse a
# precompressed body. The on-the-fly filter here runs AFTER SSI, so it is fine.
#
# zstd is NOT here: Debian packages no zstd module for nginx. See nginx.txt.

brotli on;
brotli_comp_level 5;
brotli_min_length 256;
# text/html is always compressed and must not be listed (nginx warns).
brotli_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/atom+xml
    application/rss+xml
    image/svg+xml;

gzip_vary on;
