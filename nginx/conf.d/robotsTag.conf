# X-Robots-Tag, per vhost — currently EMPTY: no vhost is listed, so nothing
# sends the header. Kept for the next alias.
#
# Built for aliases: a vhost serving the apex's docroot under a second name is
# duplicate content by construction, so it tells crawlers not to index it and
# the main name keeps the search results. hansendiscountelectronics.com was
# such an alias until 2026-09-25, when it got its own site and its row here
# was removed. The header, not robots.txt: /srv/http/robots.txt is shared by both
# names (for an alias, one docroot), it says Allow: / on purpose, and a Disallow there would
# apply to the apex too. A response header can differ per vhost; a file in a
# shared root cannot.
#
# Keyed on $server_name — the vhost's CONFIGURED name — and not on $host, the
# same choice the $drafts map makes for the same reason: no request header can
# move a name in or out of this list.
#
# nginx omits an add_header whose value evaluates to the empty string, so
# every other vhost sends nothing at all. That is what makes
# snippets/robotsTag.conf safe to include from snippets the apex shares.
#
# http context, hence conf.d — conf.d/* is included before sites-enabled/*, so
# the variable exists before any block uses it.
map $server_name $robots_tag {
    default                          "";
}
