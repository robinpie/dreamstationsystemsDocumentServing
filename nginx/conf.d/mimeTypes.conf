# Content types /etc/nginx/mime.types does not know yet.
#
# .jxl — the 88x31 wall ships a lossless JPEG XL of each badge (see
# siteAssets.txt, THE 88x31 WALL). Without this it would go out as
# application/octet-stream. (.avif and .webp are already in Debian's
# mime.types.)
#
# A `types` block at http level ADDS to the one mime.types opened; it does not
# replace it. That is unlike a `types` block inside a location (feeds.conf),
# which starts that location's map from empty. Verified with a throwaway nginx:
# .png and .avif kept their types alongside the new .jxl.

types {
    image/jxl    jxl;
}
