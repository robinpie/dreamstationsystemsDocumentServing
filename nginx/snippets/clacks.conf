# X-Clacks-Overhead — GNU Terry Pratchett (Discworld's Going Postal). No
# technical function, and meant not to have one. Included from every server
# block so it can't drift; `always` so it survives error responses too. Any
# location that sets its own add_header drops this one and must include the
# snippet again — see wkd.conf and theme.conf. See nginx.txt.
add_header X-Clacks-Overhead "GNU Terry Pratchett" always;
