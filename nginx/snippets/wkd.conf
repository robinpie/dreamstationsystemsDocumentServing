# OpenPGP Web Key Directory — draft-koch-openpgp-webkey-service. Included from
# both the apex :443 block (direct method) and openpgpkey.dreamstation.systems
# (advanced method) so the two can't drift. Content-Type deliberately not set
# — the extensionless key files correctly inherit application/octet-stream.
# CORS per spec, since these are public keys meant to be fetched by strangers.
# See nginx.txt.
location ~ ^/\.well-known/openpgpkey/ {
    include snippets/clacks.conf;
    add_header Access-Control-Allow-Origin "*" always;
}
