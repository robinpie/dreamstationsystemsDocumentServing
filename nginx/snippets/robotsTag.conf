# add_header for the $robots_tag map in conf.d/robotsTag.conf. Empty, and so
# not sent at all, on every vhost but the alias.
#
# Same trap as clacks.conf: a location that sets its own add_header drops this
# one and must include the snippet again — see theme.conf and wkd.conf, which
# re-include it in exactly the places they already re-include clacks. A
# themed /personal/ page is precisely what you would least like indexed twice,
# so those repeats are the point rather than tidiness. See nginx.txt.
add_header X-Robots-Tag $robots_tag always;
