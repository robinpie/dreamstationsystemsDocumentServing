# /pgp.asc — the ASCII-armored public key linked from /professional. .asc has
# no mime.types entry, so without this it inherits application/octet-stream
# and browsers download it instead of showing it. text/plain rather than the
# registered application/pgp-keys, deliberately, since that also downloads —
# this file exists to be read and copy-pasted. Does not affect the WKD tree
# (wkd.conf's regex location, extensionless and binary). See nginx.txt.
location = /pgp.asc {
    default_type text/plain;
    charset utf-8;
}
