# fortunes.dreamstation.systems/cookie — one random fortune, text/plain,
# rendered per request by /srv/cgi/cookie.cgi via fcgiwrap.
#
# Included from BOTH the :80 and :443 server blocks, like statusCgi.conf, so
# the two cannot drift apart.
#
# Public: auth_basic off. Harmless on :80, where there is no auth to turn off;
# on :443 it lifts the vhost-wide password for this one exact URI only. The
# script is read-only and separate from fortunes.cgi, so nothing that can write
# is reachable without the password. See ~/configNotes/fortunes.txt.
location = /cookie {
    auth_basic off;

    fastcgi_pass  unix:/run/fcgiwrap.socket;
    include       fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/cgi/cookie.cgi;
    fastcgi_param SCRIPT_NAME     /cookie;
    fastcgi_read_timeout 10s;
}
