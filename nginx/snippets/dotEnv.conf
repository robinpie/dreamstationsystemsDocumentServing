# /.env — the single most-probed path in the access log. Scanners fetch it
# hoping for a leaked framework secrets file; there is none here (static site,
# no application), so answer the knock with a pointer to security.txt instead
# of a 404.
#
# Included from EVERY server block on every vhost, catchall and onion included,
# so the answer is the same whatever Host the scanner sends. Two consequences
# for the blocks themselves, both handled where they apply:
#
#   - A server-level `return` (000-default-catchall, pool.ntp.org) runs in the
#     server rewrite phase, BEFORE location matching, and would swallow this.
#     Those returns now sit in `location /` instead. teslaNotice.conf likewise.
#   - auth_basic is inherited, so the staging and fortunes :443 blocks would
#     401 this. Turned off here; harmless where there is no auth.
#
# Exact match, so /.env.bak, /.env.production etc. are untouched. No
# add_header, so commonHeaders.conf is still inherited. 200 with a literal
# body: nothing here reads the filesystem. See nginx.txt ("/.env").
location = /.env {
    auth_basic off;
    default_type text/plain;
    charset utf-8;
    return 200 "Looking for vulnerabilities on my server? Please do, just privately report them to me: <https://dreamstation.systems/.well-known/security.txt>\n";
}
