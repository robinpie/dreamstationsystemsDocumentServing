# Content types for the blog feeds, generated by assetsBuild/makeFeed.py
# and rsynced into the docroot like everything else — this snippet only
# corrects the type they're served with, since mime.types would otherwise
# send both out as text/xml. Exact-match locations, no add_header (so
# X-Clacks-Overhead is inherited), included from both :80 and :443. See
# feeds.txt.
location = /personal/feed.xml {
    types { }
    default_type application/atom+xml;
}

location = /personal/rss.xml {
    types { }
    default_type application/rss+xml;
}
