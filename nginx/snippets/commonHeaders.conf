# Headers every vhost sends. Included from every server block so they can't
# drift; `always` so they survive error responses too. Any location that sets
# its own add_header drops ALL of these and must include the snippet again —
# see wkd.conf and theme.conf. See nginx.txt ("COMMON HEADERS").
#
# (Was clacks.conf until 2026-09-29, when the security headers joined it: one
# include already sat at every correct spot, so a second snippet would only
# have been a second thing to forget.)

# X-Clacks-Overhead — GNU Terry Pratchett (Discworld's Going Postal). No
# technical function, and meant not to have one.
add_header X-Clacks-Overhead "GNU Terry Pratchett" always;

# Don't let a browser second-guess Content-Type. Every file here is served
# with a real type (feeds are text/xml, .asc is text/plain via pgpKey.conf),
# so this changes nothing but the Observatory score and a class of bug.
add_header X-Content-Type-Options "nosniff" always;

# The modern browser default, stated explicitly: other sites see
# "dreamstation.systems" as the referrer (webrings, badges) but never the path.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Per-page policy from the $csp map in conf.d/csp.conf: a baseline everywhere
# and a strict one on the apex landing page. Never empty, so always sent.
add_header Content-Security-Policy $csp always;

# DELIBERATELY ABSENT: X-Frame-Options / frame-ancestors, HSTS, COOP, CORP,
# COEP. Chosen, not forgotten — see nginx.txt ("COMMON HEADERS").
