# The notice served for the pool-ntp.tesla.com Host — see
# sites-available/pool-ntp.tesla.com for why it exists at all.
#
# In a snippet because it is included from TWO server blocks, :80 and :443, and
# a scanner that reaches us over one protocol should not read something
# different from one that reaches us over the other. Two literal copies of the
# body in one file would drift the first time the text is edited.
#
# No location block, so nothing this serves can reach the filesystem. The same
# answer goes to every path, including the several thousand CVE probes the
# scanner walks through.
default_type text/html;
charset utf-8;

return 299 '<h1>This is not Tesla infrastructure!</h1>

<p>This is a hobbyist NTP, web, and miscellaneous server.</p>

<p>Over the past few days, I have been receiving tons of requests at the pool-ntp.tesla.com Host from three Assetnote scanning hosts (currently <code>54.165.75.96</code>, <code>35.168.63.24</code>, and <code>52.44.200.251</code>).</p>

<p>pool-ntp.tesla.com CNAMEs to pool.ntp.org, which round-robins to thousands of volunteer NTP servers, and your scanner seems to have gotten stuck to my server.</p>

<p>You have not caused me any harm, but you are throwing exploits at strangers&rsquo; IPs.</p>

<p>I have emailed VulnerabilityReporting@tesla.com about this. If you would like, email me back at <a href="mailto:robin@dreamstation.systems">robin@dreamstation.systems</a> and I can provide detailed logs.</p>
';
