# Directory listings for /miscStuff/ and everything under it — a plain file
# archive, browsed rather than linked page by page. Nowhere else on the site
# lists directories (autoindex is off by default).
#
# ^~ so no regex location can claim a path in here. No add_header, so the
# server block's commonHeaders.conf is still inherited. Included from the
# apex :80 and :443 blocks, the onion and staging — same anti-drift pattern as
# feeds.conf. See nginx.txt ("MISCSTUFF").
#
# default_type: most of what lives here is old source code — .c, .h, .shar,
# man pages (.6), extensionless README/CHANGES — none of which is in
# mime.types, so it would go out as application/octet-stream and download
# instead of display. Only UNKNOWN extensions fall back to this; anything
# mime.types does know (.png, .html, .tar.gz ...) keeps its real type.
location ^~ /miscStuff/ {
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime off;
    default_type text/plain;
    charset utf-8;
}
