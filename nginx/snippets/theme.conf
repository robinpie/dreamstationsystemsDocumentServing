# Server-side theme selection for /personal/: nginx picks the theme and SSI
# stamps it into the page, so the correct stylesheet is in the first byte.
# Precedence is ?theme=<id>, else the theme cookie, else ubuntu804 — both
# maps (in sites-available/dreamstation.systems) whitelist known ids, so an
# unknown value always falls back to the default. See nginx.txt ("THEME
# SELECTION") for the full design, including why the query parameter is
# served rather than redirected, and the file-list and index-redirect traps.
location ~ ^/personal/(index|blog|hypnospace|lanfalsehoods|ntppost|ntpuserinfo|slowqotd|gzipt)\.html$ {
    ssi on;

    # Re-sent on every request, so a visitor who browses for a while keeps
    # renewing the year rather than expiring one year after their first visit.
    # $theme is already normalised to a known id by the maps, so this cannot
    # store anything the whitelist would later reject.
    add_header Set-Cookie "theme=$theme; Path=/personal/; Max-Age=31536000; SameSite=Lax" always;

    # The HTML body now differs by cookie. Without this a cache is entitled to
    # hand one visitor's theme to the next.
    add_header Vary "Cookie" always;

    # This block defines add_header of its own, which drops the server-level
    # X-Clacks-Overhead unless it is repeated here. See clacks.conf.
    include snippets/clacks.conf;
}

# ---------------------------------------------------------------------------
# The ubuntu804 theme's chrome: three fragments under /personal/chrome/ that
# draw a whole Ubuntu 8.04 desktop around the page, pulled in by each themed
# page guarded on $theme. `ssi on` is needed here too since an #include
# virtual is a subrequest parsed by ITS OWN location's config; `internal`
# because the fragments are deliberately unbalanced HTML, meaningless on
# their own. No add_header: the parent location already set those. See
# nginx.txt.
location ^~ /personal/chrome/ {
    internal;
    ssi on;
}
