# Server-side theme selection for /personal/: nginx picks the theme and SSI
# stamps it into the page, so the correct stylesheet is in the first byte.
# Precedence is ?theme=<id>, else the theme cookie, else ubuntu804 — both
# maps (in sites-available/dreamstation.systems) whitelist known ids, so an
# unknown value always falls back to the default. See nginx.txt ("THEME
# SELECTION") for the full design, including why the query parameter is
# served rather than redirected, and the file-list and index-redirect traps.
#
# (?:\.tok)? admits each page's toki pona translation, gzipt.tok.html beside
# gzipt.html (triptych.md section 9). A translation is the same themed page
# in another language, so it takes this whole block unchanged. A second
# language is one more alternative here AND in the proto regex below.
location ~ ^/personal/(index|blog|hypnospace|lanfalsehoods|ntppool|ntppost|ntpuserinfo|slowqotd|gzipt|tesla|lawa|factors)(?:\.tok)?\.html$ {
    ssi on;

    # Re-sent on every request, so a visitor who browses for a while keeps
    # renewing the year rather than expiring one year after their first visit.
    # $theme is already normalised to a known id by the maps, so this cannot
    # store anything the whitelist would later reject.
    add_header Set-Cookie "theme=$theme; Path=/personal/; Max-Age=31536000; SameSite=Lax" always;

    # The HTML body now differs by cookie. Without this a cache is entitled to
    # hand one visitor's theme to the next.
    add_header Vary "Cookie" always;

    # This block defines add_header of its own, which drops the server-level
    # X-Clacks-Overhead unless it is repeated here. See clacks.conf.
    include snippets/clacks.conf;

    # Likewise. Empty, and so not sent, on the :80 and onion vhosts.
    include snippets/onionLocation.conf;
}

# The protocol switcher beside the theme dropdown: a GET form whose action is
# /personal/proto + the page's own $document_uri, with ?to=http|https|onion.
# Both halves of the target are whitelisted — the path by this regex (THE SAME
# FILE LIST as above; keep them in step), the origin by the $proto_base map in
# sites-available/dreamstation.systems — so this cannot be used as an open
# redirect. ?theme=$theme carries the visitor's theme to the other origin,
# where their cookie does not follow; $theme is already normalised. It lives
# under /personal/ so the theme cookie (Path=/personal/) is sent here at all.
#
# 302 and not 301: the answer depends on the query string, and a cached
# permanent redirect is the last thing a switcher wants. The URL is absolute,
# so the onion vhost's `absolute_redirect off` has nothing to rewrite.
#
# Note a modern browser may bounce ?to=http straight back to HTTPS by itself
# (Firefox HTTPS-First, Chrome's upgrades). The server really does answer on
# :80; there is nothing here to fix.
location ~ ^/personal/proto(?<proto_page>/personal/(?:index|blog|hypnospace|lanfalsehoods|ntppool|ntppost|ntpuserinfo|slowqotd|gzipt|tesla|lawa|factors)(?:\.tok)?\.html)$ {
    include snippets/clacks.conf;
    return 302 $proto_base$proto_page?theme=$theme;
}

# The language switcher, the third form in that corner: a GET form whose action
# is /personal/lang + the page's own path, with ?lang=en|tok. The answer is the
# same page with its language suffix swapped — gzipt.html <-> gzipt.tok.html
# (triptych.md section 9) — so the regex takes the page apart: the stem is
# captured, any .tok already on it is dropped, and $lang_suffix (a whitelist
# map in sites-available/dreamstation.systems) supplies the new one. Both
# halves are whitelisted, exactly as for /personal/proto/ above, and THE SAME
# FILE LIST appears a third time; keep all three in step.
#
# triptych only draws the form on a page that has a translation, but a URL can
# be typed: if the requested version does not exist, fall back to the English
# page rather than 404. (`if` + `return` is the one safe use of `if` in a
# location.) Same origin, so the theme cookie simply comes along. 302 for the
# same reason as the protocol switcher: the answer depends on the query string.
location ~ ^/personal/lang/personal/(?<lang_stem>index|blog|hypnospace|lanfalsehoods|ntppool|ntppost|ntpuserinfo|slowqotd|gzipt|tesla|lawa|factors)(?:\.tok)?\.html$ {
    include snippets/clacks.conf;
    if (!-f $document_root/personal/$lang_stem$lang_suffix.html) {
        return 302 /personal/$lang_stem.html;
    }
    return 302 /personal/$lang_stem$lang_suffix.html;
}

# ---------------------------------------------------------------------------
# The ubuntu804 theme's chrome: three fragments under /personal/chrome/ that
# draw a whole Ubuntu 8.04 desktop around the page, pulled in by each themed
# page guarded on $theme. `ssi on` is needed here too since an #include
# virtual is a subrequest parsed by ITS OWN location's config; `internal`
# because the fragments are deliberately unbalanced HTML, meaningless on
# their own. No add_header: the parent location already set those. See
# nginx.txt.
location ^~ /personal/chrome/ {
    internal;
    ssi on;
}

# lawa.html's live numbers: an HTML FRAGMENT that lawaPage.timer rewrites every
# five minutes and lawa.html pulls in with #include virtual (see
# ~/configNotes/lawa.txt, "The public page"). `internal` because a fragment is
# meaningless, and unthemed, on its own. Deliberately NO `ssi on`: nothing in
# that file is ever parsed for directives, so even if the generator were
# tricked into writing one it would arrive as inert text.
location = /personal/lawa-data.html {
    internal;
}
# The same fragment in toki pona, which lawa.tok.html includes.
location = /personal/lawa-data.tok.html {
    internal;
}
