# Onion-Location — tells Tor Browser this page is also available on our onion
# service (it shows a ".onion available" button, or switches by itself if the
# visitor has opted in). Every other client ignores it. The value, and when it
# is empty and the header therefore not sent at all, is in
# conf.d/onionLocation.conf. The onion side is sites-available/onion.dreamstation.systems.
#
# Same trap as clacks.conf: a location with an add_header of its own drops
# this one unless it includes the snippet again — see theme.conf. wkd.conf is
# skipped on purpose; the only thing that fetches those is gpg.
#
# No `always`: there is no onion twin of an error page worth pointing at.
add_header Onion-Location $onion_location;
