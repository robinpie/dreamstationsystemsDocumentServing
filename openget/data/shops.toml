# Shops excluded from /store-profit: ones whose listed coin price is not
# the real cost of admission (see openget.txt, SHOP INVENTORIES, for the
# test used to decide). Names are matched case-insensitively, ignoring a
# trailing full stop.

[[exclude]]
shop = "Mixology Rewards"
why = "Mastering Mixology reward shop. The coin price is real but incidental: stock is gated behind Mox, Aga and Lye points earned in the minigame, which no amount of coins substitutes for. Left in, it takes the top two rows of the page — a Chugging barrel bought for 1,000 gp and sold for 9.4m."
