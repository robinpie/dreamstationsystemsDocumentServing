# Log this server block with the Host header included — the `combinedHost`
# format defined in conf.d/logFormat.conf, which explains the why.
#
# INCLUDE THIS IN EVERY NEW SERVER BLOCK. A block without it silently falls
# back to nginx.conf's http-level `access_log`, which uses plain `combined` and
# drops the Host — so the one vhost you forgot is the one whose traffic you
# cannot later account for.
#
# The exception is grandexchange.dreamstation.systems, which sets its own
# access_log to openget-access.log and must NOT include this: two access_log
# directives at the same level do not override, they ADD, and OpenGET's traffic
# would land in both files.
access_log /var/log/nginx/access.log combinedHost;
