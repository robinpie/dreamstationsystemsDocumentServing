# RFC 9116 says security.txt belongs at /.well-known/security.txt; the bare
# /security.txt is a legacy location some scanners still try. Permanently
# redirect it. Exact match, so nothing else is affected. Included from the
# apex :80 and :443 blocks.
location = /security.txt {
    return 301 /.well-known/security.txt;
}
