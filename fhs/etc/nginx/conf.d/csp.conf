# Content-Security-Policy, per page. The add_header is in
# snippets/commonHeaders.conf; this is only the value.
#
# BASELINE (every vhost, every page): no plugins, no <base> hijacking. It does
# NOT restrict scripts or styles, on purpose — 24 pages use inline <script>,
# many use style= attributes, and a few load React/Babel from unpkg. A policy
# that fenced those in would be a project (Report-Only survey first), not a
# header. No form-action either: the /personal/ protocol switcher is a form
# that 302s to http:// and .onion origins, and browsers enforce form-action on
# the redirect target too.
#
# STRICT (apex landing page only): index.html is three links and nothing else,
# so it can have default-src 'none'. Be honest about what this is: that page is
# what the Mozilla HTTP Observatory scores, and it is also the one page with no
# script to protect. If index.html ever gains a stylesheet, script or image,
# widen this row or it breaks silently (check the browser console).
#
# Keyed on "$server_name:$uri" — the vhost's CONFIGURED name, like $robots_tag
# and $drafts, so no request header can pick a policy — and $uri is evaluated
# at header time, i.e. AFTER `index` has rewritten "/" to "/index.html". The
# :80 and :443 apex blocks share the name dreamstation.systems; staging and the
# onion get the same row so staging previews it and Tor visitors match.
# The onion row's key ("<62-char addr>.onion:/index.html") is 73 characters,
# too long for the default map bucket (64 here), and nginx then refuses the
# whole config: "could not build map_hash". Same problem and fix as
# serverNamesHash.conf, but it lives HERE because it must be parsed before
# the first map that needs it, and conf.d/* is read alphabetically.
map_hash_bucket_size 128;

map "$server_name:$uri" $csp {
    default "object-src 'none'; base-uri 'self'";
    "dreamstation.systems:/index.html"          "default-src 'none'; img-src 'self'; base-uri 'none'; form-action 'none'";
    "staging.dreamstation.systems:/index.html"  "default-src 'none'; img-src 'self'; base-uri 'none'; form-action 'none'";
    "dreamdzmalrqmkkptrzdvafx3lbinn3j5gvshqrnjtb72begyoqhwuqd.onion:/index.html" "default-src 'none'; img-src 'self'; base-uri 'none'; form-action 'none'";
}
