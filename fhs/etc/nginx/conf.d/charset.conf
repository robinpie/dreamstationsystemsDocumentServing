# Declare UTF-8 on every text response, http-wide.
#
# Without this, .txt files go out as bare `text/plain` (no charset), and with
# `X-Content-Type-Options: nosniff` (commonHeaders.conf) browsers fall back to
# a legacy default — usually windows-1252 — so anything non-ASCII turns into
# mojibake ("â€œ" for “). That broke "Modern Motherfucking Plaintext.txt",
# which is nothing BUT non-ASCII typography.
#
# Applies only to charset_types (nginx default: text/html, text/xml,
# text/plain, text/vnd.wap.wml, application/javascript, application/rss+xml).
# Responses that already name a charset (CGI output, the snippets that set
# their own) keep theirs; nginx does not override an existing one.
#
# Safe because everything served is UTF-8: verified 2026-11-24 with an iconv
# pass over every .txt/.html/.xml/.js/.asc under /srv/http, /srv/httpstaging,
# /srv/hansendiscountelectronics.com and /srv/modernmotherfuckingwebsite.
# Keep it that way — a Latin-1 file added later would be mislabelled.
charset utf-8;
