# $alt_svc — the Alt-Svc header value, sent from snippets/commonHeaders.conf.
#
# Advertises HTTP/3 (QUIC, UDP 443) to browsers, which only try h3 after an
# HTTPS response carries this. Empty on plain HTTP so the :80 blocks, bare-ip
# and the onion vhost (Tor carries TCP only — h3 is impossible there) send
# nothing: nginx omits an add_header whose value is empty. Lives in a map so
# the one commonHeaders include can stay at every server block unchanged.
# The NAME matters: it must sort after csp.conf (conf.d/* is read
# alphabetically), which sets map_hash_bucket_size before the first map.
# "altSvc.conf" sorted first and failed nginx -t. See nginx.txt ("HTTP/3").
map $https $alt_svc {
    on      'h3=":443"; ma=86400';
    default "";
}
