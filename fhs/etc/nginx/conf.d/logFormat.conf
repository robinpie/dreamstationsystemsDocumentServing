# The `combinedHost` log format — Debian's `combined`, plus the Host header
# and the connection's protocol (plain HTTP / TLS 1.2 / TLS 1.3), cipher and
# key-exchange group.
#
# WHY: nginx dispatches on Host, but `combined` does not record it, so the log
# cannot answer "which vhost served this?" — and with several names pointed at
# this one address (the apex and its wildcard, grandexchange, staging, the NTP
# pool names, pool-ntp.tesla.com) that question comes up.
#
# WHY IT LIVES IN conf.d: `log_format` is only valid in http context, and
# conf.d/*.conf is included from http BEFORE sites-enabled/* (see nginx.conf),
# so the format is defined before any server block refers to it. Putting it in
# a snippet would not work — snippets are included from inside server blocks,
# which is server context. The promote's named-list rule applies to conf.d
# exactly as it does to sites-available and snippets.
#
# WHY THE FIELD IS APPENDED, NOT INSERTED: everything up to the user-agent is
# byte-identical to `combined`, so anything that reads these logs positionally
# keeps working. `host=` prefixes the value to make it greppable on its own
# (`grep 'host=pool-ntp.tesla.com'`) rather than just another bare quoted field.
#
# NOTE: this format is not applied here. An `access_log` at this level would
# ADD a second destination alongside nginx.conf's, logging every request twice.
# It is applied per-server via snippets/accessLog.conf, where a server-level
# access_log REPLACES the inherited one. See nginx.txt.
#
# `proto=` records how the connection arrived: `http` for plain HTTP, else
# $ssl_protocol verbatim (`TLSv1.2` / `TLSv1.3` — nginx.conf allows no others).
# $ssl_protocol is EMPTY on a plaintext connection, so the map spells that out
# rather than leaving a bare `proto=`. The map is http context too, hence here.
# The HTTP version (1.1 / 2.0) is already inside "$request"; this is the TLS
# version only. Tally with:
#   grep -o 'proto=[^ ]*' /var/log/nginx/access.log | sort | uniq -c
# The onion vhost logs nothing (access_log off), so it never appears here.
map $ssl_protocol $connProto {
    ""      http;
    default $ssl_protocol;
}

# `cipher=` and `curve=` follow, `-` on plain HTTP (both variables are empty
# there). Names are OpenSSL's: TLS 1.3 ciphers are IANA-style
# (TLS_AES_256_GCM_SHA384) and do NOT include the key exchange; TLS 1.2 ones
# do (ECDHE-RSA-AES128-GCM-SHA256). `curve=` is the key-exchange group
# actually negotiated (X25519, or a PQ hybrid such as X25519MLKEM768) — the
# only place TLS 1.3's key exchange shows up.
map $ssl_cipher $connCipher {
    ""      -;
    default $ssl_cipher;
}

#
# nginx 1.26 names a group only if OpenSSL gives it a NID, and the ML-KEM
# hybrids (OpenSSL 3.5 offers X25519MLKEM768 FIRST, so most TLS 1.3 clients
# pick it) have none, so nginx logs the raw IANA codepoint, e.g. `0x11ec`.
# The three hybrid codepoints are spelled out below; any other `0x....` that
# shows up is a group this list doesn't know yet — look it up in IANA's "TLS
# Supported Groups" registry and add it here.
map $ssl_curve $connCurve {
    ""      -;
    0x11eb  SecP256r1MLKEM768;
    0x11ec  X25519MLKEM768;
    0x11ed  SecP384r1MLKEM1024;
    default $ssl_curve;
}

log_format combinedHost '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        'host=$host proto=$connProto cipher=$connCipher curve=$connCurve';
