# server_names_hash_bucket_size — raised for the onion vhost
# (sites-available/onion.dreamstation.systems). A v3 onion address is 62
# characters, and grandexchange.<addr>.onion is 76; the default bucket (64 on
# this CPU) cannot hold either, and nginx refuses to start at all — "could not
# build server_names_hash" — rather than merely ignoring the name. 128 is the
# next step up. http context, hence conf.d.
server_names_hash_bucket_size 128;
