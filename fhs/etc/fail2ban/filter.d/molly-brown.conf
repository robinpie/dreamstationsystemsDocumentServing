# fail2ban filter for the molly-brown Gemini server (journal access log)
# Access log line is tab-separated:  <ISO8601-ts>\t<IP>\t<status>\t<url>
# NOTE: do NOT anchor with ^ - fail2ban keeps molly's leading timestamp on the
# line, and an anchored <HOST> greedily matches digits inside that timestamp.
# Anchoring instead on the "<status> gemini://" tail uniquely targets request
# lines (and skips systemd start/stop noise on the same journal unit).
[Definition]
failregex = <HOST>\s+\d+\s+gemini://
ignoreregex =
