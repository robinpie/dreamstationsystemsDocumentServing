# Molly Brown config for dreamstation.systems
# Started by: systemctl start molly-brown@dreamstation

Hostname  = "dreamstation.systems"
Port      = 1965
CertPath  = "/etc/molly-brown/certs/dreamstation.crt"
KeyPath   = "/etc/molly-brown/certs/dreamstation.key"
DocBase   = "/srv/gemini"

# Auto-generate a directory listing when a dir has no index.gmi
DirectorySort = "Name"

# Logs. "-" = stdout (captured by the journal). fail2ban reads the journal.
AccessLog = "-"
ErrorLog  = ""

# OpenGET dynamic pages (see openget.txt). The static gemtext under /ge/ is
# regenerated by the openget daemon every five minutes and needs nothing here;
# this is only for the paths that take input — item lookup and search.
CGIPaths = ["/srv/gemini/ge/cgi-bin/*"]
