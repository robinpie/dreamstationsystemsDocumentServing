# triptych target profiles — the per-protocol conventions, stated once.
# See triptych.md §3. Anything here can be narrowed per page (front matter),
# per block (an @ attribute line) or per link (a link table row).

[html]
out     = rootdomain/personal/
mode    = inline
dash    = thin

[gemini]
out     = gemini/
postdir = blog/
mode    = defer
gap     = 3
code_angle = strip
tabs    = 4

[gopher]
out     = gopher/
postdir = blog/
mode    = label
code_angle = strip
tabs    = 4
host    = dreamstation.systems
port    = 70

# Site-wide link table. A page's own @links block extends (and overrides) it.
# "-" means the link is not made on that target: the anchor text stays as
# prose, which is how the retro copies drop a link the web keeps.
[links]
home      html=index.html          gemini=/                 gopher=/
blog      html=blog.html           gemini=/blog/            gopher=/blog
ntpstats  html=/ntpstats.txt       gemini=/ntpstats.gmi     gopher=/0/ntpstats.txt gopher.sel=/ntpstats.txt
ntpuser   html=ntpuserinfo.html    gemini=/ntpuserinfo.gmi  gopher=/0/ntpuserinfo.txt gopher.sel=/ntpuserinfo.txt
services  html=-                   gemini=/services.gmi     gopher=/0/services.txt gopher.sel=/services.txt
status    html=/professional/status gemini=https://dreamstation.systems/professional/status gopher=https://dreamstation.systems/professional/status
openget   html=https://grandexchange.dreamstation.systems gemini=/ge/ gopher=/ge
ftp       html=ftp://dreamstation.systems gemini=ftp://dreamstation.systems gopher=ftp://dreamstation.systems \
          gopher.label="ftp://dreamstation.systems  (the FTP archive)"
gopherurl html=gopher://dreamstation.systems/ gemini=gopher://dreamstation.systems gopher=-
geminiurl html=gemini://dreamstation.systems/ gemini=- gopher=gemini://dreamstation.systems \
          gopher.label="gemini://dreamstation.systems  (the same place, over Gemini)"
spartan   html=spartan://dreamstation.systems/ gemini=spartan://dreamstation.systems gopher=spartan://dreamstation.systems \
          gopher.label="spartan://dreamstation.systems  (the same place, over Spartan)"
