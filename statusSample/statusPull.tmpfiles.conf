# /run/status/<host> — where statusPull@<host>.service leaves each remote
# host's vitals for status.cgi and ntpstatsgen. Installed as
# /etc/tmpfiles.d/statusPull.conf by promoteSite.sh. The parent /run/status is
# created by status.conf (tmpfiles orders by path). One line per entry in
# promoteSite.sh's PULL_HOSTS; a host without its directory fails its pull
# (and ReadWritePaths= would refuse to start the unit at all).
d /run/status/starport     0755 statuspull statuspull -
d /run/status/thecomicshop 0755 statuspull statuspull -
